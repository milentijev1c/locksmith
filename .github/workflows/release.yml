name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Linux dependencies
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev

      - name: Install Windows MinGW
        if: matrix.runner == 'windows-latest'
        shell: bash
        run: |
          echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.goos == 'windows' && 'x86_64-w64-mingw32-gcc' || '' }}
        run: |
          BINARY="locksmith-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${BINARY}" .

      - name: Package (Linux/macOS)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          cd dist
          BINARY="locksmith-${{ matrix.goos }}-${{ matrix.goarch }}"
          tar -czf "${BINARY}.tar.gz" "${BINARY}"
          echo "ASSET=${BINARY}.tar.gz" >> $GITHUB_ENV

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          cd dist
          $binary = "locksmith-windows-amd64.exe"
          Compress-Archive -Path $binary -DestinationPath "locksmith-windows-amd64.zip"
          echo "ASSET=locksmith-windows-amd64.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip