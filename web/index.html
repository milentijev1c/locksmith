<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locksmith — Sign PDF</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232733;
    --border: #2e3345;
    --accent: #6c5ce7;
    --accent-hover: #7e6ff0;
    --green: #00b894;
    --red: #e17055;
    --yellow: #fdcb6e;
    --text: #e4e6ef;
    --text-dim: #8b8fa3;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  header h1 span { color: var(--accent); }

  header p {
    color: var(--text-dim);
    font-size: 0.95rem;
  }

  .status-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .status-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 18px;
    font-size: 0.85rem;
    font-weight: 500;
    transition: border-color 0.3s;
  }

  .status-chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red);
    transition: background 0.3s;
  }

  .status-chip.connected .dot { background: var(--green); }
  .status-chip.connected { border-color: var(--green); }
  .status-chip.card-present .dot { background: var(--yellow); }
  .status-chip.card-present { border-color: var(--yellow); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    width: 100%;
    max-width: 520px;
    margin-bottom: 24px;
  }

  .card h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 20px;
  }

  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(108, 92, 231, 0.05);
  }

  .upload-zone.has-file {
    border-color: var(--green);
    background: rgba(0, 184, 148, 0.05);
  }

  .upload-zone .icon {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }

  .upload-zone .label {
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  .upload-zone .filename {
    color: var(--green);
    font-weight: 600;
    font-size: 0.95rem;
    margin-top: 4px;
  }

  .upload-zone .filesize {
    color: var(--text-dim);
    font-size: 0.8rem;
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  input[type="password"],
  select {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 16px;
  }

  input[type="password"]:focus, select:focus {
    border-color: var(--accent);
  }

  select option {
    background: var(--surface2);
    color: var(--text);
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-success {
    background: var(--green);
    color: white;
  }

  .btn-success:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--green);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 520px;
    margin-bottom: 24px;
    display: none;
  }

  .result-card h2 { margin-bottom: 16px; }

  .result-card .field {
    margin-bottom: 12px;
  }

  .result-card .field label {
    margin-bottom: 4px;
  }

  .result-card .field .value {
    background: var(--surface2);
    border-radius: 6px;
    padding: 10px 14px;
    font-family: 'Fira Code', monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
    word-break: break-all;
    max-height: 80px;
    overflow-y: auto;
  }

  .download-btns {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }

  .download-btns .btn {
    flex: 1;
    width: auto;
  }

  .error-msg {
    background: rgba(225, 112, 85, 0.1);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--red);
    font-size: 0.9rem;
    margin-top: 16px;
    display: none;
  }

  .ws-log {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    width: 100%;
    max-width: 520px;
    max-height: 160px;
    overflow-y: auto;
    font-family: 'Fira Code', monospace;
    font-size: 0.78rem;
    color: var(--text-dim);
    line-height: 1.7;
  }

  .ws-log .log-entry { white-space: nowrap; }
  .ws-log .log-time { color: #5a5e72; }
  .ws-log .log-event { color: var(--accent); }
  .ws-log .log-info { color: var(--green); }
  .ws-log .log-error { color: var(--red); }

  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: var(--green);
    color: white;
    padding: 14px 24px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

<header>
  <h1>🔐 <span>Locksmith</span></h1>
  <p>Sign PDFs with your Serbian ID card</p>
</header>

<div class="status-bar">
  <div class="status-chip" id="wsStatus">
    <div class="dot"></div>
    <span>Service disconnected</span>
  </div>
  <div class="status-chip" id="readerStatus">
    <div class="dot"></div>
    <span>No reader</span>
  </div>
  <div class="status-chip" id="cardStatus">
    <div class="dot"></div>
    <span>No card</span>
  </div>
</div>

<div class="card">
  <h2>📄 Select PDF to Sign</h2>

  <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <input type="file" id="fileInput" accept=".pdf" hidden>
    <div class="icon">📁</div>
    <div class="label">Click or drag a PDF file here</div>
  </div>

  <label for="pinInput">Card PIN</label>
  <input type="password" id="pinInput" placeholder="Enter your ID card PIN" autocomplete="off">

  <label for="algoSelect">Signing Algorithm</label>
  <select id="algoSelect">
    <option value="SHA256withRSA">SHA256withRSA (recommended)</option>
    <option value="SHA384withRSA">SHA384withRSA</option>
    <option value="SHA512withRSA">SHA512withRSA</option>
  </select>

  <button class="btn btn-primary" id="signBtn" disabled>
    ✍️ Sign PDF
  </button>

  <div class="error-msg" id="errorMsg"></div>
</div>

<div class="result-card" id="resultCard">
  <h2>✅ PDF Signed Successfully</h2>
  <div class="download-btns">
    <button class="btn btn-success" onclick="downloadSignedPDF()">⬇ Download Signed PDF</button>
  </div>
</div>

<div class="ws-log" id="wsLog">
  <div class="log-entry"><span class="log-time">[--:--:--]</span> <span class="log-info">Waiting for connection...</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'http://127.0.0.1:19711';
const WS_URL = 'ws://127.0.0.1:19711/ws';

let pdfFile = null;
let lastSignedBlob = null;
let ws = null;
let reconnectTimer = null;

// --- Elements ---
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const pinInput = document.getElementById('pinInput');
const algoSelect = document.getElementById('algoSelect');
const signBtn = document.getElementById('signBtn');
const errorMsg = document.getElementById('errorMsg');
const resultCard = document.getElementById('resultCard');
const wsLog = document.getElementById('wsLog');

// --- File handling ---
function updateUI() {
  signBtn.disabled = !pdfFile || pinInput.value.trim().length === 0;
}

function handleFile(file) {
  if (!file || file.type !== 'application/pdf') {
    showError('Please select a valid PDF file.');
    return;
  }
  pdfFile = file;

  dropZone.classList.add('has-file');
  dropZone.innerHTML = `
    <input type="file" id="fileInput" accept=".pdf" hidden>
    <div class="icon">📄</div>
    <div class="filename">${file.name}</div>
    <div class="filesize">${(file.size / 1024).toFixed(1)} KB</div>
  `;

  // Re-attach listener to the new hidden input
  document.getElementById('fileInput').addEventListener('change', e => {
    handleFile(e.target.files[0]);
  });

  hideError();
  updateUI();
}

fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

pinInput.addEventListener('input', updateUI);

// --- Signing ---
signBtn.addEventListener('click', async () => {
  if (!pdfFile) return;

  const pin = pinInput.value.trim();
  if (!pin) { showError('Please enter your PIN.'); return; }

  hideError();
  signBtn.disabled = true;
  signBtn.innerHTML = '<div class="spinner"></div> Signing...';

  try {
    // Read file as ArrayBuffer, convert to base64
    const arrayBuf = await pdfFile.arrayBuffer();
    const bytes = new Uint8Array(arrayBuf);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    const payloadBase64 = btoa(binary);

    const algo = algoSelect.value;

    const res = await fetch(`${API}/card/sign-pdf`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        payload_base64: payloadBase64,
        pin: pin,
        algorithm: algo,
      }),
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText || `HTTP ${res.status}`);
    }

    const blob = await res.blob();
    lastSignedBlob = blob;

    // Show result card
    resultCard.style.display = 'block';
    resultCard.scrollIntoView({ behavior: 'smooth' });
    showToast('PDF signed successfully!');
    appendLog('PDF signed: ' + pdfFile.name + ' (' + (blob.size / 1024).toFixed(1) + ' KB)', 'info');

  } catch (err) {
    showError('Signing failed: ' + err.message);
    appendLog('Sign error: ' + err.message, 'error');
  } finally {
    signBtn.disabled = false;
    signBtn.innerHTML = '✍️ Sign PDF';
    updateUI();
  }
});

// --- Downloads ---
function downloadSignedPDF() {
  if (!lastSignedBlob) return;
  const baseName = pdfFile ? pdfFile.name.replace(/\.pdf$/i, '') : 'document';
  const url = URL.createObjectURL(lastSignedBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = baseName + '_signed.pdf';
  a.click();
  URL.revokeObjectURL(url);
}

// --- Error display ---
function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
}
function hideError() {
  errorMsg.style.display = 'none';
}

// --- Toast ---
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// --- WebSocket ---
function connectWS() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    appendLog('WebSocket connected', 'info');
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleWSEvent(msg);
    } catch {}
  };

  ws.onclose = () => {
    setChip('wsStatus', false, 'Service disconnected');
    setChip('readerStatus', false, 'No reader');
    setChip('cardStatus', false, 'No card');
    appendLog('WebSocket disconnected, reconnecting...', 'error');
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectWS, 2000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

function handleWSEvent(msg) {
  const type = msg.type || '';

  if (type === 'ws.connected') {
    setChip('wsStatus', true, 'Service connected');
  } else if (type === 'reader.connected') {
    setChip('readerStatus', true, msg.reader || 'Reader connected');
    appendLog('Reader connected: ' + (msg.reader || '—'), 'info');
  } else if (type === 'reader.disconnected') {
    setChip('readerStatus', false, 'Reader disconnected');
    appendLog('Reader disconnected', 'error');
  } else if (type === 'card.inserted') {
    setChip('cardStatus', true, 'Card inserted');
    appendLog('Card inserted', 'info');
    showToast('🪪 Card detected!');
  } else if (type === 'card.removed') {
    setChip('cardStatus', false, 'Card removed');
    appendLog('Card removed', 'error');
    showToast('Card removed');
  }
}

function setChip(id, active, text) {
  const el = document.getElementById(id);
  el.querySelector('span').textContent = text;
  if (id === 'wsStatus' || id === 'readerStatus') {
    el.classList.toggle('connected', active);
  } else {
    el.classList.toggle('card-present', active);
  }
}

// --- Log ---
function appendLog(text, cls) {
  const now = new Date();
  const time = now.toTimeString().split(' ')[0];
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${cls || 'info'}">${text}</span>`;
  wsLog.appendChild(entry);
  wsLog.scrollTop = wsLog.scrollHeight;
}

// --- Init ---
connectWS();
appendLog('Page loaded', 'info');

// Health check
fetch(`${API}/status`)
  .then(r => r.json())
  .then(d => {
    appendLog(`Service v${d.version} — reader: ${d.reader_connected}, card: ${d.card_present}`, 'info');
    setChip('wsStatus', true, 'Service connected');
  })
  .catch(() => appendLog('Service unreachable', 'error'));
</script>
</body>
</html>
